<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio de Números</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="titulo">
            <h1>Sorteio de Número</h1>
            <img class="dado" src="dados_sorteio.png" alt="Dado">
        </div>
        

        <div class="inputs">

            <div>
                <label for="minimo">Número mínimo:</label>
                <input type="number" id="minimo" placeholder="Ex: 1">
            </div>

            <div>
                <label for="maximo">Número máximo:</label>
                <input type="number" id="maximo" placeholder="Ex: 100">
            </div>

        </div>

        <button onclick="sortear()">Sortear</button>

        <div id="resultado">
            <p>Resultado:</p>
            <span id="numero">?</span>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
